services:
  mysql:
    image: mysql:8.0
    platform: linux/arm64
    container_name: user-management-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: user_management
    expose:
      - "3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: user-management-backend
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: user_management
      MYSQL_USER: root
      MYSQL_PASSWORD: root123
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  frontend-admin:
    build:
      context: ./frontend-admin
      args:
        VITE_API_URL: ""
    container_name: user-management-admin
    ports:
      - "8081:80"
    depends_on:
      - backend
    restart: unless-stopped

  frontend-user:
    build:
      context: ./frontend-user
      args:
        VITE_API_URL: ""
    container_name: user-management-user
    ports:
      - "8082:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mysql_data:
